[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperis"
version = "0.1.0"
description = "Noise-robust Icelandic speech recognition with an MLOps pipeline"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Model + training
    "torch",
    "torchaudio",
    "transformers",
    "peft",
    "accelerate",
    "datasets<4.0",        # Samrómur uses a loading script; datasets 4.x dropped support
    # Audio + metrics
    "librosa",
    "soundfile",
    "jiwer",               # WER / CER
    # MLOps
    "mlflow",
    "dvc",
    "pyyaml",
    # Serving
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "faster-whisper",
    "prometheus-client",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]